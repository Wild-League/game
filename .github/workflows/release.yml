name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LÖVE 12 packages
        id: love-build
        uses: nhartland/love-build@v1
        with:
          app_name: "WildLeague"
          love_version: "12.0"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildLeague-macos
          path: ${{ steps.love-build.outputs.macos-filename }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildLeague-windows
          path: ${{ steps.love-build.outputs.win64-filename }}

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WildLeague-windows/WildLeague-windows.zip
            dist/WildLeague-macos/WildLeague-macos.zip
